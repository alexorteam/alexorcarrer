const yr2=x=>"Temporada "+x.season+"/"+String(x.season+1).slice(2);
function dl(i){const a=ST.g("fc")||[];a.splice(i,1);ST.s("fc",a);saves()}

/* ---------- nueva carrera ---------- */

<div class="card"><label>Posición</label><select onchange="SU.ch.p=this.value">${Object.keys(POSG).map(p=>`<option ${p==h.p?"selected":""}>${p}</option>`)}</select></div>

<button class="b" onclick="s2()">Elegir club</button><button class="s" onclick="menu()">Volver</button></div>`)}

S={id:Date.now(),ch:c,nat:SU.nat,age:a,ovr:o,club:cb,num:n,season:2026,val:0,hist:[],week:0,sp:CFG.sp,paused:false,ph:"play",prev:0,caps:0,cg:0,feed:[],chat:[],soc:[],cur:{pj:0,g:0,a:0,r:0}};

/* ---------- carrera ---------- */
function chat(w,m){S.chat.unshift({w,m});S.chat.length=Math.min(S.chat.length,40)}
function soc(u,m){S.soc.unshift({u,m});S.soc.length=Math.min(S.soc.length,40)}
function career(){V(`<div id="hud"><div id="hl"></div><div id="hr"></div></div><div id="mid"></div><div id="bar"><div><button onclick="pm('c')">💬 Chat</button><button onclick="pm('s')">🐦 Redes</button></div><div><button id="bp" onclick="S.paused=!S.paused;bt();loop()"></button><button id="bs" onclick="S.sp=S.sp%4+1;bt();loop()"></button><button onclick="sv()">💾</button><button onclick="if(confirm('¿Volver al menú? Guarda antes tu carrera.')){menu()}">☰</button></div></div>`);bt();draw();loop()}
function bt(){$("#bp").textContent=S.paused?"▶ Seguir":"⏸ Pausa";$("#bs").textContent=["","1×","2×","4×","8×"][S.sp]}
function loop(){clearTimeout(T);if(!S||S.ph!=="play"||S.paused)return;T=setTimeout(()=>{tick();loop()},[0,900,450,220,100][S.sp])}
function draw(){if(!$("#hl"))return;$("#hl").innerHTML=`<b>Temporada ${yr()}</b><br><small>${S.age} años</small>`;$("#hr").innerHTML=`<small>Valor de mercado</small><br><b>${f(S.val)}</b>`;
const c=S.cur,t=S.club.t;$("#mid").innerHTML=`<div class="tabs"><button class="${TB=="c"?"on":""}" onclick="TB='c';draw()">Carrera</button><button class="${TB=="h"?"on":""}" onclick="TB='h';draw()">Historial</button></div>`+(TB=="c"?`<div class="card row">${av(S.ch,64,S.num)}<div class="sp"><b>${S.ch.n}</b><br><small>${S.ch.p} · ${S.club.n} (${S.club.c})</small><br><small>Selección: ${S.nat} · Media ${S.ovr}</small></div></div>
<div class="card"><div class="row"><b class="sp">Jornada ${Math.min(S.week,38)} de 38</b><small>${TN[t]}</small></div><div class="pg" style="margin:6px 0"><i style="width:${S.week/38*100}%"></i></div></div>
<div class="g"><div><b>${c.pj}</b><small>Partidos</small></div><div><b>${c.g}</b><small>Goles</small></div><div><b>${c.a}</b><small>Asist.</small></div><div><b>${c.pj?(c.r/c.pj).toFixed(1):"-"}</b><small>Nota</small></div></div>
<div class="card"><b>Selección ${S.nat}</b><br><small>${S.caps} partidos · ${S.cg} goles</small></div>
<div class="card"><b>Últimos partidos</b>${S.feed.length?S.feed.map(x=>`<div><small>${x}</small></div>`).join(""):'<div><small>La temporada acaba de empezar.</small></div>'}</div>`:`<div class="card" style="overflow:auto"><table><tr><th>Temp.</th><th>Club</th><th>PJ</th><th>G</th><th>A</th><th>Nota</th><th>Valor</th></tr>${S.hist.map(h=>`<tr><td>${h.s}</td><td>${h.cl}</td><td>${h.pj}</td><td>${h.g}</td><td>${h.a}</td><td>${h.r}</td><td>${f(h.v)}</td></tr>`).join("")||'<tr><td colspan="7">Sin temporadas jugadas aún.</td></tr>'}</table></div>`)}
function tick(){S.week++;const w=S.week,t=S.club.t,c=S.cur,o=S.ovr,d=o-L[t],g=POSG[S.ch.p],rv=P(D[S.club.c].filter(x=>x.n!==S.club.n)).n;
if(Math.random()<mf(o,t)){const k=C(Math.exp(d/20),.3,2.2),G=pois(g[0]*k),A=pois(g[1]*k),r=C(6.2+d/15+G*.8+A*.5+R(-.9,.9),4.5,10);c.pj++;c.g+=G;c.a+=A;c.r+=r;
S.feed.unshift(`J${w} vs ${rv}: ${G?G+" gol"+(G>1?"es":""):"sin gol"}${A?", "+A+" asist.":""} · nota ${r.toFixed(1)}`);
if(G>1)chat("Hinchas","¡"+G+" goles hoy! Eres el héroe de la afición 🔥");else if(G)soc("LaLiga Fans","⚽ "+S.ch.n+" marca contra "+rv+".")}
else{S.feed.unshift(`J${w} vs ${rv}: no convocado / banquillo`);if(Math.random()<.4)chat("Entrenador","Necesito verte más en los entrenamientos para darte minutos.")}
S.feed.length=Math.min(S.feed.length,7);
if(w%6==0){const x=P(Object.values(D).flat());soc("RumoresFichajes","💸 "+x.n+" sigue a "+P(FN)+" "+P(LN)+" para el próximo verano.");if(Math.random()<.5)soc("MercadoLive","📈 El valor de "+S.ch.n+" ahora es "+f(S.val*(1+c.pj/200))+".")}
if(w>=38)endS();draw();if($("#ov").classList.contains("on")&&S.pm)pm(S.pm)}
function pm(t){S.pm=t;const a=t=="c"?S.chat.map(x=>`<div class="msg"><b>${x.w}</b><br>${x.m}</div>`):S.soc.map(x=>`<div class="msg"><b>@${x.u}</b><br>${x.m}</div>`);OV(`<div class="row"><h2 class="sp">${t=="c"?"Chat del club":"Redes sociales"}</h2><button class="s" onclick="S.pm=0;CL()">Cerrar</button></div><div class="tabs" style="margin-bottom:8px"><button class="${t=="c"?"on":""}" onclick="pm('c')">💬 Chat</button><button class="${t=="s"?"on":""}" onclick="pm('s')">🐦 Redes</button></div>${a.join("")||'<p class="mu">Sin mensajes todavía.</p>'}`)}

/* ---------- fin de temporada ---------- */
function endS(){S.ph="sum";clearTimeout(T);const c=S.cur,avg=c.pj?c.r/c.pj:5.5,old=S.val,pct=S.prev?(avg-S.prev)/S.prev*100:null;
if(S.ovr>=70&&Math.random()<(S.ovr-66)/20){const n=RI(2,8);S.caps+=n;S.cg+=pois(n*POSG[S.ch.p][0]*.7);S.sel=n}else S.sel=0;
S.hist.push({s:yr(),cl:S.club.n,pj:c.pj,g:c.g,a:c.a,r:avg.toFixed(1),v:old});
const a=S.age+1,pr=a<=21?RI(2,5):a<=24?RI(1,4):a<=28?RI(-1,2):a<=31?RI(-2,1):RI(-3,0);S.ovr=C(S.ovr+pr+Math.round((avg-6.5)),48,92);S.age=a;
S.val=val(S.ovr,a)*TM[S.club.t]*(1+C(S.prev?(avg-S.prev)*.08:(avg-6.5)*.05,-.15,.25));S.sumData={c:{...c},avg,pct,old};S.prev=avg;
chat("Prensa","Balance de temporada: "+c.g+" goles y "+c.a+" asistencias.");
const d=S.val/old-1;OV(`<h2>Fin de temporada ${yr()}</h2><div class="g"><div><b>${c.pj}</b><small>Partidos</small></div><div><b>${c.g}</b><small>Goles</small></div><div><b>${c.a}</b><small>Asist.</small></div><div><b>${avg.toFixed(1)}</b><small>Nota</small></div></div>
<div class="card" style="margin:10px 0"><div>Mejor temporada que la anterior: <b class="${pct==null?"":pct>=0?"up":"dn"}">${pct==null?"primera temporada":(pct>=0?"+":"")+pct.toFixed(1)+"%"}</b></div><div>Valor de mercado: ${f(old)} → <b class="${d>=0?"up":"dn"}">${f(S.val)}</b> (${d>=0?"+":""}${(d*100).toFixed(1)}%)</div>${S.sel?`<div>Selección ${S.nat}: ${S.sel} partidos esta temporada</div>`:""}</div><button class="b" style="width:100%" onclick="after()">Continuar</button>`)}
function after(){if(Math.random()<ret(S.age)){retire();return}offers()}
function offers(){const all=Object.values(D).flat().filter(x=>x.n!==S.club.n);let el=all.filter(x=>L[x.t]<=S.ovr+9);if(el.length<3)el=all.filter(x=>x.t==3);
S.of=SH(el).slice(0,4).map(x=>({x,fee:S.val*R(.85,1.35)*(x.c=="Arabia Saudí"?1.4:1),g:(TM[x.t]/TM[S.club.t]-1)*100+R(-2,8),p:pb(S.ovr,x.t)}));
